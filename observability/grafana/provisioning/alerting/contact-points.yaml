apiVersion: 1
contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          # The responder runs on the host (it launches the coding assistant
          # from your own shell), so Grafana reaches it via the host gateway.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
